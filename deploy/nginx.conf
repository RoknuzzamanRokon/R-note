# nginx site for rnote.travomapping.com
#   frontend (Next.js)  -> 127.0.0.1:3035
#   backend  (FastAPI)  -> 127.0.0.1:8035  (/api/, /upload-blog-image, /uploads/)
# HTTPS is added afterwards by: sudo certbot --nginx -d rnote.travomapping.com

server {
    listen 80;
    server_name rnote.travomapping.com;

    # Image uploads are up to 10 MB (nginx default is 1 MB)
    client_max_body_size 12m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8035;
    }

    location = /upload-blog-image {
        proxy_pass http://127.0.0.1:8035;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8035;
    }

    location / {
        proxy_pass http://127.0.0.1:3035;
    }
}
